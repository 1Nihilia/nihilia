  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const VIDEO_ID = "GaLaMd_EAo4";
    let ytPlayer = null;
    let ytReady = false;
    let wantsPlay = false;
    let isMuted = false;
    let progressTimer = null;

    const playIcon = document.getElementById("play-icon");
    const pauseIcon = document.getElementById("pause-icon");
    const progressFill = document.getElementById("progress-fill");
    const currentTimeEl = document.getElementById("current-time");
    const durationTimeEl = document.getElementById("duration-time");

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function updatePlayState(playing) {
      playIcon.style.display = playing ? "none" : "block";
      pauseIcon.style.display = playing ? "block" : "none";
    }

    function startProgressLoop() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (!ytPlayer || !ytReady) return;
        const dur = ytPlayer.getDuration();
        const cur = ytPlayer.getCurrentTime();
        if (dur > 0) {
          durationTimeEl.textContent = formatTime(dur);
          currentTimeEl.textContent = formatTime(cur);
          progressFill.style.width = `${Math.min(Math.max((cur / dur) * 100, 0), 100)}%`;
        }
      }, 400);
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("yt-player", {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          loop: 1,
          playlist: VIDEO_ID,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1
        },
        events: {
          onReady: (event) => {
            ytReady = true;
            event.target.setVolume(45);
            const dur = event.target.getDuration();
            if (dur > 0) {
              durationTimeEl.textContent = formatTime(dur);
            }
            if (wantsPlay) {
              event.target.playVideo();
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              updatePlayState(true);
              startProgressLoop();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
              updatePlayState(false);
              clearInterval(progressTimer);
            }
          }
        }
      });
    }

    function enterSite() {
      wantsPlay = true;
      document.getElementById("enter-overlay").classList.add("hidden");
      if (ytPlayer && ytReady) {
        ytPlayer.playVideo();
        updatePlayState(true);
      }
    }

    function togglePlay() {
      if (!ytPlayer || !ytReady) {
        wantsPlay = !wantsPlay;
        updatePlayState(wantsPlay);
        return;
      }
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        wantsPlay = false;
        ytPlayer.pauseVideo();
        updatePlayState(false);
      } else {
        wantsPlay = true;
        ytPlayer.playVideo();
        updatePlayState(true);
      }
    }

    function restartAudio() {
      if (!ytPlayer || !ytReady) return;
      ytPlayer.seekTo(0, true);
      ytPlayer.playVideo();
      wantsPlay = true;
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById("vol-on").style.display = isMuted ? "none" : "block";
      document.getElementById("vol-off").style.display = isMuted ? "block" : "none";
      if (ytPlayer && ytReady) {
        if (isMuted) {
          ytPlayer.mute();
        } else {
          ytPlayer.unMute();
          ytPlayer.setVolume(45);
        }
      }
    }

    function seekAudio(e) {
      if (!ytPlayer || !ytReady) return;
      const dur = ytPlayer.getDuration();
      if (!dur) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
      const targetSec = ratio * dur;
      ytPlayer.seekTo(targetSec, true);
      currentTimeEl.textContent = formatTime(targetSec);
      progressFill.style.width = `${ratio * 100}%`;
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
      } finally {
        document.body.removeChild(textarea);
      }
    }

    function copyDiscord(box) {
      const text = box.dataset.copy;
      const label = document.getElementById("copy-label");

      const onSuccess = () => {
        label.textContent = "Copied";
        box.classList.add("copied");
        clearTimeout(box._copyTimer);
        box._copyTimer = setTimeout(() => {
          label.textContent = "Copy";
          box.classList.remove("copied");
        }, 1400);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
          fallbackCopy(text);
          onSuccess();
        });
      } else {
        fallbackCopy(text);
        onSuccess();
      }
    }
  </script>
