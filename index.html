<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where you can find me</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f2eef0;
      background-color: #060507;
      background-image:
        radial-gradient(circle at 50% 30%, rgba(155, 18, 38, 0.14), rgba(5, 4, 6, 0.88) 72%),
        linear-gradient(180deg, rgba(6, 5, 7, 0.58) 0%, rgba(6, 5, 7, 0.84) 100%),
        url("Nihiihihi_20260829163758.webp");
      background-size: cover;
      background-position: center 25%;
      background-attachment: fixed;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 28px 22px;
      border-radius: 14px;
      background: rgba(9, 8, 11, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(185, 28, 46, 0.28);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.78),
        0 0 28px rgba(130, 12, 28, 0.14);
      text-align: center;
    }

    .handle {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f7f3f5;
      text-shadow: 0 0 14px rgba(185, 28, 46, 0.35);
    }

    .bio {
      margin-top: 5px;
      margin-bottom: 22px;
      font-size: 0.86rem;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      color: rgba(214, 198, 202, 0.65);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn, .copy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      background: rgba(18, 15, 20, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f4eff1;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover, .copy-row:hover {
      background: rgba(34, 12, 18, 0.92);
      border-color: rgba(210, 38, 60, 0.55);
      box-shadow: 0 0 16px rgba(165, 20, 40, 0.22);
      transform: translateY(-1px);
    }

    .meta {
      font-size: 0.8rem;
      color: rgba(215, 196, 200, 0.58);
    }

    .copy-btn {
      background: rgba(145, 20, 38, 0.28);
      border: 1px solid rgba(210, 38, 60, 0.35);
      border-radius: 7px;
      color: #f7eef0;
      padding: 5px 10px;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .copy-btn:hover {
      background: rgba(185, 26, 48, 0.48);
      border-color: rgba(235, 55, 78, 0.65);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="handle">One and only Nihilia</h1>
    <p class="bio">2718</p>

    <div class="links">
      <a class="btn" href="https://open.spotify.com/user/314tsfyhizcxmpy4m5goltyam73q" target="_blank" rel="noopener noreferrer">
        <span>Spotify</span>
        <span class="meta">profile</span>
      </a>

      <a class="btn" href="https://steamcommunity.com/id/1sirius/" target="_blank" rel="noopener noreferrer">
        <span>Steam</span>
        <span class="meta">1sirius</span>
      </a>

      <a class="btn" href="https://stats.fm/nihilia" target="_blank" rel="noopener noreferrer">
        <span>stats.fm</span>
        <span class="meta">@nihilia</span>
      </a>

      <div class="copy-row">
        <div>
          <div>Discord</div>
          <div class="meta" id="discord-user">nihilia.</div>
        </div>
        <button class="copy-btn" type="button" onclick="copyDiscord(this)">Copy</button>
      </div>
    </div>
  </main>

  <script>
    function copyDiscord(btn) {
      const text = document.getElementById("discord-user").textContent.trim();
      navigator.clipboard.writeText(text);
      const original = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = original), 1400);
    }
  </script>
</body>
</html>
