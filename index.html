<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nihilia.one</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f5f5f7;
      background-color: #0b0c10;
      background-image:
        linear-gradient(rgba(10, 11, 16, 0.68), rgba(10, 11, 16, 0.78)),
        url("Nihiihihi_20260829163758.webp");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 28px 22px;
      border-radius: 20px;
      background: rgba(18, 20, 28, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .handle {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .bio {
      margin-top: 6px;
      margin-bottom: 22px;
      font-size: 0.92rem;
      color: rgba(245, 245, 247, 0.75);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn, .copy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover, .copy-row:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .meta {
      font-size: 0.82rem;
      color: rgba(245, 245, 247, 0.65);
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.14);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="handle">@nihilia</h1>
    <p class="bio">nihilia.one</p>

    <div class="links">
      <!-- Spotify -->
      <a class="btn" href="https://open.spotify.com/user/314tsfyhizcxmpy4m5goltyam73q" target="_blank" rel="noopener noreferrer">
        <span>Spotify</span>
        <span class="meta">perfil</span>
      </a>

      <!-- Steam -->
      <a class="btn" href="https://steamcommunity.com/id/1sirius/" target="_blank" rel="noopener noreferrer">
        <span>Steam</span>
        <span class="meta">steam</span>
      </a>

      <!-- stats.fm -->
      <a class="btn" href="https://stats.fm/nihilia" target="_blank" rel="noopener noreferrer">
        <span>stats.fm</span>
        <span class="meta">@nihilia</span>
      </a>

      <!-- Discord user com botão copiar -->
      <div class="copy-row">
        <div>
          <div>Discord</div>
          <div class="meta" id="discord-user">nihilia.</div>
        </div>
        <button class="copy-btn" type="button" onclick="copiarDiscord()">Copiar</button>
      </div>
    </div>
  </main>

  <script>
    function copiarDiscord() {
      const texto = document.getElementById("discord-user").textContent.trim();
      navigator.clipboard.writeText(texto);
      const btn = event.target;
      const original = btn.textContent;
      btn.textContent = "Copiado";
      setTimeout(() => (btn.textContent = original), 1400);
    }
  </script>
</body>
</html>
