<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@nihilia</title>
  <style>
    :root {
      --bg: #0b0b10;
      --card: #13131b;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #a78bfa;
      --spotify: #1db954;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b162b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 36px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-height: 52px;
    }

    .typewriter-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      font-size: 0.95rem;
      min-height: 1.2em;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background: var(--accent);
      animation: blink 0.9s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .sound-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(167, 139, 250, 0.16);
      border-color: rgba(167, 139, 250, 0.45);
    }

    input[type="range"] {
      width: 88px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .spotify-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .spotify-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--spotify);
    }

    .now-playing {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-box {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #09090d;
      aspect-ratio: 16 / 9;
    }

    .player-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .playlist {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-btn {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .track-btn:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .track-btn.active {
      background: rgba(167, 139, 250, 0.14);
      border-color: rgba(167, 139, 250, 0.45);
    }

    .track-num {
      color: var(--muted);
      margin-right: 8px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- Barra superior -->
    <header class="bar">
      <div class="typewriter-wrap">
        <span id="typedText"></span>
        <span class="cursor" aria-hidden="true"></span>
      </div>

      <div class="sound-controls">
        <button id="muteBtn" class="icon-btn" type="button" title="Silenciar / Ativar som" aria-label="Silenciar ou ativar som">
          🔊
        </button>
        <input id="volumeSlider" type="range" min="0" max="100" value="45" title="Volume" aria-label="Volume" />
      </div>
    </header>

    <!-- Bloco Spotify sem texto "profile" -->
    <section class="card" aria-label="Spotify">
      <div class="spotify-header">
        <div class="spotify-badge">
          <span>Spotify</span>
        </div>
        <div id="nowPlaying" class="now-playing">04. Heartache - Hotfreaks</div>
      </div>

      <div class="player-box">
        <iframe
          id="ytPlayer"
          src="https://www.youtube.com/embed/WcDDXYMwUS8?enablejsapi=1&autoplay=0"
          title="Reprodutor de música"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <div class="playlist" id="playlist">
        <button class="track-btn active" type="button" data-id="WcDDXYMwUS8" data-label="04. Heartache - Hotfreaks">
          <span><span class="track-num">04.</span>Heartache - Hotfreaks</span>
        </button>
        <button class="track-btn" type="button" data-id="Rl089HxOPkw" data-label="05. Across The Sea - Weezer">
          <span><span class="track-num">05.</span>Across The Sea - Weezer</span>
        </button>
      </div>
    </section>
  </main>

  <script>
    // 1. Efeito de escrita na barra: escreve "@nihilia", espera, apaga até ficar vazio e recomeça
    const typedEl = document.getElementById("typedText");
    const targetWord = "@nihilia";
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function runBarLoop() {
      while (true) {
        typedEl.textContent = "";
        document.title = "\u200E";

        for (let i = 1; i <= targetWord.length; i++) {
          const partial = targetWord.slice(0, i);
          typedEl.textContent = partial;
          document.title = partial;
          await sleep(140);
        }

        // Espera uns segundos com "@nihilia" visível
        await sleep(2600);

        // Apaga até ficar completamente vazio (sem mostrar nome do site)
        for (let i = targetWord.length - 1; i >= 0; i--) {
          const partial = targetWord.slice(0, i);
          typedEl.textContent = partial;
          document.title = partial || "\u200E";
          await sleep(80);
        }

        // Pausa vazio antes de voltar a escrever o "@nihilia"
        await sleep(1800);
      }
    }

    runBarLoop();

    // 2. Controlo de volume e faixa (suporta API do YouTube se carregada + fallback seguro)
    const ytIframe = document.getElementById("ytPlayer");
    const volumeSlider = document.getElementById("volumeSlider");
    const muteBtn = document.getElementById("muteBtn");
    const nowPlayingEl = document.getElementById("nowPlaying");
    const trackButtons = document.querySelectorAll(".track-btn");

    let lastVolume = Number(volumeSlider.value);

    function postYTCommand(func, args = []) {
      if (!ytIframe.contentWindow) return;
      ytIframe.contentWindow.postMessage(
        JSON.stringify({ event: "command", func, args }),
        "*"
      );
    }

    function applyVolume(val) {
      const clamped = Math.max(0, Math.min(100, Number(val)));
      volumeSlider.value = clamped;
      postYTCommand("setVolume", [clamped]);
      if (clamped === 0) {
        postYTCommand("mute");
        muteBtn.textContent = "🔇";
      } else {
        postYTCommand("unMute");
        muteBtn.textContent = clamped < 50 ? "🔉" : "🔊";
        lastVolume = clamped;
      }
    }

    volumeSlider.addEventListener("input", (e) => {
      applyVolume(e.target.value);
    });

    muteBtn.addEventListener("click", () => {
      const current = Number(volumeSlider.value);
      if (current > 0) {
        lastVolume = current;
        applyVolume(0);
      } else {
        applyVolume(lastVolume > 0 ? lastVolume : 45);
      }
    });

    trackButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        trackButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        const videoId = btn.dataset.id;
        const label = btn.dataset.label;
        nowPlayingEl.textContent = label;
        ytIframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1`;

        setTimeout(() => applyVolume(volumeSlider.value), 600);
      });
    });
  </script>
</body>
</html>
