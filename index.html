    .track-title {

    .time {

    .ctrl-btn {

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;

  </style>

  <audio id="bg-audio" src="musica.mp3" loop preload="metadata"></audio>

  <script>
    const audio = document.getElementById("bg-audio");
    const playIcon = document.getElementById("play-icon");
    const pauseIcon = document.getElementById("pause-icon");
    const progressFill = document.getElementById("progress-fill");
    const currentTimeEl = document.getElementById("current-time");
    const durationTimeEl = document.getElementById("duration-time");

    audio.volume = 0.45;

    function formatTime(sec) {
      if (!isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function updatePlayState() {
      const playing = !audio.paused;
      playIcon.style.display = playing ? "none" : "block";
      pauseIcon.style.display = playing ? "block" : "none";
    }

    function enterSite() {
      document.getElementById("enter-overlay").classList.add("hidden");
      audio.play().then(updatePlayState).catch(() => {});
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(updatePlayState).catch(() => {});
      } else {
        audio.pause();
        updatePlayState();
      }
    }

    function restartAudio() {
      audio.currentTime = 0;
      if (audio.paused) {
        audio.play().then(updatePlayState).catch(() => {});
      }
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      document.getElementById("vol-on").style.display = audio.muted ? "none" : "block";
      document.getElementById("vol-off").style.display = audio.muted ? "block" : "none";
    }

    function seekAudio(e) {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
      audio.currentTime = ratio * audio.duration;
    }

    audio.addEventListener("loadedmetadata", () => {
      durationTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
      }
    });

    audio.addEventListener("play", updatePlayState);
    audio.addEventListener("pause", updatePlayState);

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
      } finally {
        document.body.removeChild(textarea);
      }
    }

    function copyDiscord(box) {
      const text = box.dataset.copy;
      const label = document.getElementById("copy-label");

      const onSuccess = () => {
        label.textContent = "Copied";
        box.classList.add("copied");
        clearTimeout(box._copyTimer);
        box._copyTimer = setTimeout(() => {
          label.textContent = "Copy";
          box.classList.remove("copied");
        }, 1400);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
          fallbackCopy(text);
          onSuccess();
        });
      } else {
        fallbackCopy(text);
        onSuccess();
      }
    }
  </script>
