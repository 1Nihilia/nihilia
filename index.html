    .card {

    .rune-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 310px;
      height: 310px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.11;
      color: #c92038;
    }

    .card-content {
      position: relative;

    }

    .sigil-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      color: rgba(214, 42, 64, 0.78);
      font-size: 0.72rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .sigil-top::before,
    .sigil-top::after {
      content: "";
      height: 1px;
      width: 38px;
      background: linear-gradient(90deg, transparent, rgba(195, 28, 48, 0.55));
    }

    .sigil-top::after {
      background: linear-gradient(270deg, transparent, rgba(195, 28, 48, 0.55));
    }

    .handle {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;

      text-shadow: 0 0 18px rgba(195, 24, 46, 0.45);

    .bio {

      letter-spacing: 0.1em;
      color: rgba(216, 194, 198, 0.68);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn, .copy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 18px;
      border-radius: 11px;
      background: rgba(16, 12, 18, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f5eff1;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.015em;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover, .copy-row:hover {
      background: rgba(36, 10, 17, 0.94);
      border-color: rgba(218, 36, 58, 0.62);
      box-shadow: 0 0 20px rgba(175, 18, 38, 0.26);
      transform: translateY(-1px);
    }

    .meta {
      font-size: 0.84rem;
      color: rgba(218, 194, 198, 0.6);
    }

    .copy-btn {
      background: rgba(155, 18, 38, 0.28);
      border: 1px solid rgba(218, 36, 58, 0.42);
      border-radius: 8px;
      color: #f9f1f3;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .copy-btn:hover {
      background: rgba(195, 24, 46, 0.52);
      border-color: rgba(240, 58, 82, 0.72);
    }

    .footer-mark {
      margin-top: 20px;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      color: rgba(196, 168, 174, 0.45);
    }
  </style>
</head>
