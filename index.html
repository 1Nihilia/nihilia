  <style>
    body {
      font-family: 'Space Mono', monospace;
      background-color: #000000;
      color: #ffffff;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

    .pixel-font {

    .pixel-btn {
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease, color 0.15s ease;

    .pixel-btn:hover {
      transform: translate(-2px, -2px);

    }

    .pixel-btn:active {
      transform: translate(0, 0);

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 24px;
      margin: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-runnable-track {
      height: 4px;
      border: 1px solid currentColor;
      background: transparent;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px;
      height: 12px;
      margin-top: -5px;
      border: 0;
      border-radius: 0;
      background: currentColor;
    }

    .volume-slider::-moz-range-track {
      box-sizing: border-box;
      height: 4px;
      border: 1px solid currentColor;
      background: transparent;
    }

    .volume-slider::-moz-range-thumb {
      width: 8px;
      height: 12px;
      border: 0;
      border-radius: 0;
      background: currentColor;
    }

    .volume-slider:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.28) 50%,
        rgba(0, 0, 0, 0.28)

      background-size: 100% 4px;
      pointer-events: none;
    }

    .enter-overlay {
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .enter-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #yt-player-container {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }
  </style>

  <div id="yt-player-container">

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Ciclo contínuo: escreve "@nihilia" -> apaga até "@" -> reescreve "nihilia"
    const prefix = "@";
    const handle = "nihilia";
    let currentText = "";
    let phase = "typing-full"; // "typing-full" | "deleting-to-at" | "typing-handle"

    function animateTitle() {
      if (phase === "typing-full") {
        const full = prefix + handle;
        if (currentText.length < full.length) {
          currentText = full.slice(0, currentText.length + 1);
          document.title = currentText;
          setTimeout(animateTitle, 150);
        } else {
          phase = "deleting-to-at";
          setTimeout(animateTitle, 900);
        }
      } else if (phase === "deleting-to-at") {
        if (currentText.length > prefix.length) {
          currentText = currentText.slice(0, currentText.length - 1);
          document.title = currentText;
          setTimeout(animateTitle, 100);
        } else {
          phase = "typing-handle";
          setTimeout(animateTitle, 350);
        }
      } else if (phase === "typing-handle") {
        const handleTyped = currentText.slice(prefix.length);
        if (handleTyped.length < handle.length) {
          currentText = prefix + handle.slice(0, handleTyped.length + 1);
          document.title = currentText;
          setTimeout(animateTitle, 150);
        } else {
          phase = "deleting-to-at";
          setTimeout(animateTitle, 900);
        }
      }
    }

    animateTitle();

    const playlist = [
      {
        id: "GaLaMd_EAo4",
        title: "DEMOLITION LOVERS",
        artist: "MY CHEMICAL ROMANCE",
        duration: "06:07",
        cover: "https://img.youtube.com/vi/GaLaMd_EAo4/hqdefault.jpg"
      },
      {
        id: "v2vWDWxYJBc",
        title: "PINK TRIANGLE",
        artist: "WEEZER",
        duration: "03:59",
        cover: "https://img.youtube.com/vi/v2vWDWxYJBc/hqdefault.jpg"
      },
      {
        id: "_wlOcEF_n5o",
        title: "PUPPY PRINCESS",
        artist: "HOT FREAKS",
        duration: "04:16",
        cover: "https://img.youtube.com/vi/_wlOcEF_n5o/hqdefault.jpg"
      },
      {
        id: "WcDDXYMwUS8",
        title: "HEARTACHE",
        artist: "HOT FREAKS",
        duration: "03:43",
        cover: "https://img.youtube.com/vi/WcDDXYMwUS8/hqdefault.jpg"
      },
      {
        id: "Rl089HxOPkw",
        title: "ACROSS THE SEA",
        artist: "WEEZER",
        duration: "04:33",
        cover: "https://img.youtube.com/vi/Rl089HxOPkw/hqdefault.jpg"
      }
    ];

    let currentIndex = 0;
    let ytPlayer = null;
    let ytReady = false;
    let wantsPlay = false;
    let isPlayingState = false;
    let progressTimer = null;

    const volumeSlider = document.getElementById("volume-slider");
    const progressFill = document.getElementById("progress-fill");
    const currentTimeEl = document.getElementById("current-time");
    const durationTimeEl = document.getElementById("duration-time");
    const playSymbol = document.getElementById("play-symbol");
    const trackTitleEl = document.getElementById("track-title");
    const trackArtistEl = document.getElementById("track-artist");
    const coverArtEl = document.getElementById("cover-art");
    const tracklistEl = document.getElementById("tracklist");

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function renderTracklist() {
      tracklistEl.innerHTML = "";
      playlist.forEach((track, idx) => {
        const active = idx === currentIndex;
        const row = document.createElement("div");
        row.className = active
          ? "flex justify-between text-white font-bold bg-neutral-900 px-2 py-1 cursor-pointer"
          : "flex justify-between text-neutral-400 hover:text-white px-2 py-0.5 cursor-pointer";
        row.onclick = () => selectTrack(idx, true);

        const num = String(idx + 1).padStart(2, "0");
        const prefixIcon = active ? (isPlayingState ? "&#9654;" : "&#9632;") : "";
        row.innerHTML = `
          <span class="truncate">${prefixIcon} ${num}. ${track.title}</span>
          <span class="text-neutral-400 text-[10px] ml-2 shrink-0">${track.duration}</span>
        `;
        tracklistEl.appendChild(row);
      });
    }

    function updateTrackUI() {
      const track = playlist[currentIndex];
      trackTitleEl.textContent = track.title;
      trackArtistEl.textContent = track.artist;
      coverArtEl.src = track.cover;
      durationTimeEl.textContent = track.duration;
      currentTimeEl.textContent = "0:00";
      progressFill.style.width = "0%";
      renderTracklist();
    }

    function updatePlayState(playing) {
      isPlayingState = playing;
      playSymbol.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
      renderTracklist();
    }

    function selectTrack(idx, autoPlay) {
      currentIndex = (idx + playlist.length) % playlist.length;
      updateTrackUI();
      if (autoPlay) {
        wantsPlay = true;
      }
      if (ytPlayer && ytReady) {
        if (autoPlay) {
          ytPlayer.loadVideoById(playlist[currentIndex].id);
        } else {
          ytPlayer.cueVideoById(playlist[currentIndex].id);
        }
      }
    }

    function prevTrack() {
      selectTrack(currentIndex - 1, true);
    }

    function nextTrack() {
      selectTrack(currentIndex + 1, true);
    }

    function startProgressLoop() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (!ytPlayer || !ytReady) return;
        const dur = ytPlayer.getDuration();
        const cur = ytPlayer.getCurrentTime();
        if (dur > 0) {
          durationTimeEl.textContent = formatTime(dur);
          currentTimeEl.textContent = formatTime(cur);
          progressFill.style.width = `${Math.min(Math.max((cur / dur) * 100, 0), 100)}%`;
        }
      }, 400);
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("yt-player", {
        videoId: playlist[0].id,
        playerVars: {
          autoplay: 0,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1
        },
        events: {
          onReady: (event) => {
            ytReady = true;
            updateVolume();
            if (wantsPlay) {
              event.target.playVideo();
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              updatePlayState(true);
              startProgressLoop();
            } else if (event.data === YT.PlayerState.PAUSED) {
              updatePlayState(false);
              clearInterval(progressTimer);
            } else if (event.data === YT.PlayerState.ENDED) {
              clearInterval(progressTimer);
              nextTrack();
            }
          }
        }
      });
    }

    function enterSite() {
      wantsPlay = true;
      document.getElementById("enter-overlay").classList.add("hidden");
      if (ytPlayer && ytReady) {
        ytPlayer.playVideo();
        updatePlayState(true);
      }
    }

    function togglePlay() {
      if (!ytPlayer || !ytReady) {
        wantsPlay = !wantsPlay;
        updatePlayState(wantsPlay);
        return;
      }
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        wantsPlay = false;
        ytPlayer.pauseVideo();
        updatePlayState(false);
      } else {
        wantsPlay = true;
        ytPlayer.playVideo();
        updatePlayState(true);
      }
    }

    function updateVolume() {
      const volume = Number(volumeSlider.value);
      const isMuted = volume === 0;
      volumeSlider.title = `Volume: ${volume}%`;
      document.getElementById("vol-on").classList.toggle("hidden", isMuted);
      document.getElementById("vol-off").classList.toggle("hidden", !isMuted);
      if (ytPlayer && ytReady) {
        ytPlayer.setVolume(volume);
        if (isMuted) {
          ytPlayer.mute();
        } else {
          ytPlayer.unMute();
        }
      }
    }

    function seekAudio(e) {
      if (!ytPlayer || !ytReady) return;
      const dur = ytPlayer.getDuration();
      if (!dur) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
      const targetSec = ratio * dur;
      ytPlayer.seekTo(targetSec, true);
      currentTimeEl.textContent = formatTime(targetSec);
      progressFill.style.width = `${ratio * 100}%`;
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
      } finally {
        document.body.removeChild(textarea);
      }
    }

    function copyDiscord(box) {
      const text = box.dataset.copy;
      const label = document.getElementById("copy-label");

      const onSuccess = () => {
        label.textContent = "Copied";
        clearTimeout(box._copyTimer);
        box._copyTimer = setTimeout(() => {
          label.textContent = "Copy";
        }, 1400);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
          fallbackCopy(text);
          onSuccess();
        });
      } else {
        fallbackCopy(text);
        onSuccess();
      }
    }

    updateTrackUI();
  </script>
</body>
</html>
